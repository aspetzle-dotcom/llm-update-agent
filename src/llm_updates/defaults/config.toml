schema_version = "1"
source_set_version = "2026-10-14.1"
database = "data/updates.sqlite3"
output_dir = "data/digests"
user_agent = "personal-llm-updates/0.1 (manual personal research)"
minimum_relevance = 0.15
recency_half_life_days = 7
source_family_cap = 3

[limits]
candidates_per_source = 100
lookback_days = 7
overlap_hours = 48
source_timeout_seconds = 90
wall_seconds = 600
response_bytes = 2000000
model_calls = 8
tool_calls = 12
network_enrichments = 4
call_input_tokens = 12000
call_output_tokens = 2000
total_input_tokens = 60000
total_output_tokens = 12000
run_usd = 0.50
month_usd = 5.00

[provider]
provider = "openai"
model = ""
currency = "USD"
checked_at = ""
context_window = 0
# Verify current model pricing and context size before enabling paid generation.
# Set all three rates, including cached input, in USD per million tokens.
# input_per_million = ...
# cached_input_per_million = ...
# output_per_million = ...

[profile]
depth = "Explain LLM systems terms; assume Python and mathematics familiarity."
reading_minutes = 10
excluded_topics = []
concepts_to_revisit = ["context selection", "retrieval evaluation"]

[profile.topics.context]
weight = 1.3
keywords = ["context window", "context engineering", "context selection", "long context", "compaction"]
[profile.topics.retrieval]
weight = 1.2
keywords = ["retrieval", "RAG", "reranking", "embedding"]
[profile.topics.evaluation]
weight = 1.2
keywords = ["evaluation", "evals", "benchmark", "grounding"]
[profile.topics.inference]
weight = 1.1
keywords = ["inference", "KV cache", "quantization", "batching", "speculative decoding"]
[profile.topics.tools]
weight = 1.0
keywords = ["tool use", "tool calling", "function calling", "structured output"]
[profile.topics.libraries]
weight = 0.8
keywords = ["transformers", "vllm", "llama.cpp", "langgraph", "breaking change"]

[[sources]]
source_id = "arxiv-cl"
kind = "arxiv"
name = "arXiv cs.CL"
endpoint = "https://export.arxiv.org/api/query?search_query=cat%3Acs.CL"
category = "cs.CL"
allowed_paths = { "export.arxiv.org" = ["/api/query"] }

[[sources]]
source_id = "arxiv-lg"
kind = "arxiv"
name = "arXiv cs.LG"
endpoint = "https://export.arxiv.org/api/query?search_query=cat%3Acs.LG"
category = "cs.LG"
allowed_paths = { "export.arxiv.org" = ["/api/query"] }

[[sources]]
source_id = "github-vllm"
kind = "github"
name = "vLLM releases"
repository = "vllm-project/vllm"
endpoint = "https://api.github.com/repos/vllm-project/vllm/releases"
allowed_paths = { "api.github.com" = ["/repos/vllm-project/vllm/releases", "/repos/vllm-project/vllm/releases/"] }

