[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "personal-llm-updates"
version = "0.1.0"
description = "An inspectable, evidence-first personal LLM update CLI"
requires-python = ">=3.11"
dependencies = [
  "pydantic==2.14.1", "feedparser==6.0.14", "beautifulsoup4==4.15.0",
]

[project.optional-dependencies]
openai = ["openai==2.54.0"]
dev = ["pytest==9.1.1", "ruff==0.17.0"]

[project.scripts]
llm-updates = "llm_updates.cli:main"

[tool.setuptools.package-data]
llm_updates = ["storage/*.sql", "defaults/*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]
